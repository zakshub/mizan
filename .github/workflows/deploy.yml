name: Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: 187.77.207.96
      DEPLOY_USER: user
      DEPLOY_PATH: /home/user/web/staging.mizan.zuhaib.pro
      DEPLOY_URL: http://staging.mizan.zuhaib.pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Prepare release archive
        run: tar -czf mizan-release.tgz -C out .
      - name: Validate deployment settings
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH"; exit 1; }
          case "$DEPLOY_PATH" in
            /home/*/web/*.zuhaib.pro) ;;
            *) echo "DEPLOY_PATH must be a Hestia domain root under /home/<user>/web/<domain>"; exit 1 ;;
          esac
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          def wrap_openssh_payload(payload):
              encoded_payload = base64.b64encode(payload).decode()
              body = "\n".join(textwrap.wrap(encoded_payload, width=70))
              return (
                  "-----BEGIN OPENSSH PRIVATE KEY-----\n"
                  f"{body}\n"
                  "-----END OPENSSH PRIVATE KEY-----\n"
              ).encode()

          def extract_assigned_value(value):
              value = value.replace("\r", "").strip()
              for marker in ("DEPLOY_SSH_KEY_B64=", "DEPLOY_SSH_KEY="):
                  if marker in value:
                      value = value.split(marker, 1)[1].splitlines()[0].strip()
                      break
              return value.strip("'\"")

          def decode_base64(value):
              compact = re.sub(rb"\s+", b"", value)
              if not compact or not re.fullmatch(rb"[A-Za-z0-9+/=_\-]+", compact):
                  return None
              compact += b"=" * (-len(compact) % 4)
              try:
                  return base64.b64decode(compact, altchars=b"-_", validate=False)
              except Exception:
                  return None

          def find_private_keys(*secret_values):
              queue = []
              seen = set()
              private_keys = []
              private_key_set = set()

              for secret_value in secret_values:
                  value = extract_assigned_value(secret_value)
                  if value:
                      queue.append((value.encode(), 0))

              while queue:
                  candidate, depth = queue.pop(0)
                  if candidate in seen:
                      continue
                  seen.add(candidate)

                  begin = candidate.find(b"-----BEGIN OPENSSH PRIVATE KEY-----")
                  end_marker = b"-----END OPENSSH PRIVATE KEY-----"
                  end = candidate.find(end_marker)
                  if begin >= 0 and end > begin:
                      end += len(end_marker)
                      private_key = candidate[begin:end] + b"\n"
                      if private_key not in private_key_set:
                          private_keys.append(private_key)
                          private_key_set.add(private_key)
                      continue

                  if candidate.startswith(b"openssh-key-v1\0"):
                      private_key = wrap_openssh_payload(candidate)
                      if private_key not in private_key_set:
                          private_keys.append(private_key)
                          private_key_set.add(private_key)
                      continue

                  if depth < 3:
                      decoded = decode_base64(candidate)
                      if decoded:
                          queue.append((decoded, depth + 1))

              return private_keys

          keys = find_private_keys(
              os.environ.get("DEPLOY_SSH_KEY_B64", ""),
              os.environ.get("DEPLOY_SSH_KEY", ""),
          )
          if not keys:
              raise SystemExit("No valid OpenSSH private key found in deployment secrets")

          ssh_dir = Path.home().joinpath(".ssh")
          for index, key in enumerate(keys):
              ssh_dir.joinpath(f"deploy_key_{index}").write_bytes(key)
          PY
          chmod 600 ~/.ssh/deploy_key_*
          for candidate in ~/.ssh/deploy_key_*; do
            ssh-keygen -y -f "$candidate" > /dev/null
          done
      - name: Select authorized SSH key
        run: |
          for candidate in ~/.ssh/deploy_key_*; do
            echo "Trying $(ssh-keygen -lf "$candidate" -E sha256 | awk '{print $2}')"
            if ssh \
              -o BatchMode=yes \
              -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=accept-new \
              -i "$candidate" \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "true"; then
              cp "$candidate" ~/.ssh/deploy_key
              echo "Authorized deployment key selected."
              exit 0
            fi
          done
          echo "None of the configured deployment keys is authorized for $DEPLOY_USER@$DEPLOY_HOST" >&2
          exit 1
      - name: Upload release
        run: |
          scp \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            mizan-release.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/mizan-release.tgz"
      - name: Publish to Hestia public_html
        run: |
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -eu
          deploy_path="$1"
          case "$deploy_path" in
            /home/*/web/*.zuhaib.pro) ;;
            *) echo "Unsafe deployment path: $deploy_path" >&2; exit 1 ;;
          esac

          public_dir="$deploy_path/public_html"
          release_dir="$deploy_path/mizan-release-next"
          test -d "$public_dir"

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$deploy_path/mizan-release.tgz" -C "$release_dir"
          find "$public_dir" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf -- {} +
          cp -a "$release_dir"/. "$public_dir"/
          rm -rf "$release_dir"
          rm -f "$deploy_path/mizan-release.tgz"
          REMOTE
      - name: Verify deployed site
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$DEPLOY_URL" | grep -q "Mizan"; then
              echo "Deployment verified: $DEPLOY_URL"
              exit 0
            fi
            echo "Waiting for $DEPLOY_URL (attempt $attempt/5)"
            sleep 5
          done
          echo "Deployment smoke test failed: $DEPLOY_URL" >&2
          exit 1
