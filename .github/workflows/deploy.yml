name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Prepare release archive
        run: tar -czf mizan-release.tgz app lib tests package.json package-lock.json next.config.mjs Dockerfile docker-compose.yml .env.example README.md
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust host
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload release
        run: scp mizan-release.tgz "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/mizan-release.tgz"
      - name: Deploy on VPS
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "set -e; cd '${DEPLOY_PATH}'; rm -rf current incoming; mkdir -p incoming current; tar -xzf mizan-release.tgz -C incoming; mv incoming/* current/; cd current; printf '%s\n' 'NODE_ENV=production' 'PORT=3000' 'NEXT_PUBLIC_APP_NAME=Mizan Decision Room' > .env.production; docker compose down || true; docker compose up -d --build"
