name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_HOST: 187.77.207.96
      DEPLOY_USER: user
      DEPLOY_PATH: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'production') || github.ref_name == 'main') && '/home/user/web/mizan.zuhaib.pro' || '/home/user/web/staging.mizan.zuhaib.pro' }}
      DEPLOY_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.target == 'production') || github.ref_name == 'main') && 'https://mizan.zuhaib.pro' || 'https://staging.mizan.zuhaib.pro' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Prepare release archive
        run: tar -czf mizan-release.tgz -C out .
      - name: Validate deployment settings
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH"; exit 1; }
          case "$DEPLOY_PATH" in
            /home/*/web/*.zuhaib.pro) ;;
            *) echo "DEPLOY_PATH must be a Hestia domain root under /home/<user>/web/<domain>"; exit 1 ;;
          esac
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          def wrap_openssh_payload(payload):
              encoded_payload = base64.b64encode(payload).decode()
              body = "\n".join(textwrap.wrap(encoded_payload, width=70))
              return (
                  "-----BEGIN OPENSSH PRIVATE KEY-----\n"
                  f"{body}\n"
                  "-----END OPENSSH PRIVATE KEY-----\n"
              ).encode()

          encoded = os.environ.get("DEPLOY_SSH_KEY_B64", "").strip()
          raw = os.environ.get("DEPLOY_SSH_KEY", "").replace("\r", "").strip()

          if encoded:
              if encoded.startswith("DEPLOY_SSH_KEY_B64="):
                  encoded = encoded.split("=", 1)[1]
              encoded = re.sub(r"\s+", "", encoded)
              encoded += "=" * (-len(encoded) % 4)
              try:
                  key = base64.b64decode(encoded, altchars=b"-_", validate=False)
              except Exception as error:
                  raise SystemExit(f"Unable to decode DEPLOY_SSH_KEY_B64: {error}")
          elif raw:
              if raw.startswith("DEPLOY_SSH_KEY="):
                  raw = raw.split("=", 1)[1].strip()
              key = (raw + "\n").encode()
          else:
              raise SystemExit("Missing DEPLOY_SSH_KEY_B64 or DEPLOY_SSH_KEY")

          if key.startswith(b"openssh-key-v1\0"):
              key = wrap_openssh_payload(key)
          elif re.fullmatch(rb"[A-Za-z0-9+/=_\-\s]+", key.strip()):
              nested = base64.b64decode(
                  re.sub(rb"\s+", b"", key.strip()) + b"===",
                  altchars=b"-_",
                  validate=False,
              )
              if nested.startswith(b"openssh-key-v1\0"):
                  key = wrap_openssh_payload(nested)

          if not key.startswith(b"-----BEGIN OPENSSH PRIVATE KEY-----"):
              raise SystemExit("Decoded secret is not an OpenSSH private key")

          Path.home().joinpath(".ssh", "deploy_key").write_bytes(key)
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
      - name: Trust host
        run: ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload release
        run: scp -i ~/.ssh/deploy_key mizan-release.tgz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/mizan-release.tgz"
      - name: Publish to Hestia public_html
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -eu
          deploy_path="$1"
          case "$deploy_path" in
            /home/*/web/*.zuhaib.pro) ;;
            *) echo "Unsafe deployment path: $deploy_path" >&2; exit 1 ;;
          esac

          public_dir="$deploy_path/public_html"
          release_dir="$deploy_path/mizan-release-next"
          test -d "$public_dir"

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$deploy_path/mizan-release.tgz" -C "$release_dir"
          find "$public_dir" -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf -- {} +
          cp -a "$release_dir"/. "$public_dir"/
          rm -rf "$release_dir"
          rm -f "$deploy_path/mizan-release.tgz"
          REMOTE
      - name: Verify deployed site
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$DEPLOY_URL" | grep -q "Mizan"; then
              echo "Deployment verified: $DEPLOY_URL"
              exit 0
            fi
            echo "Waiting for $DEPLOY_URL (attempt $attempt/5)"
            sleep 5
          done
          echo "Deployment smoke test failed: $DEPLOY_URL" >&2
          exit 1
